name: CI/CD Pipeline

# ============================================================
# Strategi trigger:
# - Branch dev    : jalankan CI, CT, dan Continuous Inspection
#                   pada setiap push & pull request.
# - Branch main   : setelah merge, jalankan seluruh tahap di atas
#                   PLUS Continuous Delivery (job deploy).
# ============================================================
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # ----------------------------------------------------------
  # 1. CONTINUOUS INTEGRATION — kompilasi & resolusi dependensi
  # ----------------------------------------------------------
  build:
    name: CI - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile project (Maven)
        run: mvn -B compile --file pom.xml

  # ----------------------------------------------------------
  # 2. CONTINUOUS TESTING — unit test otomatis
  #    Pipeline GAGAL bila ada test yang tidak lulus (default Maven).
  # ----------------------------------------------------------
  test:
    name: CT - Unit Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test --file pom.xml

      - name: Upload test reports
        if: always()   # tetap upload walau test gagal, untuk bahan demo
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

  # ----------------------------------------------------------
  # 3. CONTINUOUS INSPECTION — analisis statis SonarCloud
  #    Quality Gate menentukan lulus/tidaknya tahap ini.
  # ----------------------------------------------------------
  inspect:
    name: Inspection - SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diperlukan agar analisis blame & coverage akurat

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test & analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io

  # ----------------------------------------------------------
  # 4. CONTINUOUS DELIVERY — build artifact & deploy
  #    HANYA berjalan di branch main (setelah merge).
  #    Memakai GitHub Environment "production" yang
  #    membutuhkan PERSETUJUAN MANUAL (manual approval).
  # ----------------------------------------------------------
  deploy:
    name: CD - Delivery
    runs-on: ubuntu-latest
    needs: inspect
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # atur reviewer di Settings > Environments
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package executable JAR
        run: mvn -B package -DskipTests --file pom.xml

      - name: Publish artifact (release build)
        uses: actions/upload-artifact@v4
        with:
          name: student-registration-system-jar
          path: target/student-registration-system-1.0.0.jar
          retention-days: 30
